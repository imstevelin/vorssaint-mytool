name: Fork CI

on:
  push:
    branches: [main, 'codex/sync-upstream-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  compatibility:
    name: Swift 6.0.3 compatibility
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify toolchain
        run: |
          swiftc --version | grep -F "Apple Swift version 6.0.3"
          test "$(xcrun --sdk macosx --show-sdk-version)" = "15.2"

      - name: Build
        run: ./build.sh

      - name: Selftest
        run: ./build/VorssaintImstevelin --selftest

      - name: Unit tests
        run: ./build.sh --test

      - name: Maintenance tooling tests
        run: python3 Tests/UpstreamAssessmentTests.py

  build:
    name: Build & selftest
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build
        run: ./build.sh

      - name: Selftest
        run: ./build/VorssaintImstevelin --selftest

      - name: Verify bundle and display helpers
        run: |
          APP='build/stage/實用小工具.app'
          codesign --verify --deep --strict "$APP"
          plutil -lint "$APP/Contents/Info.plist"
          test -x "$APP/Contents/Helpers/DisplayRecoveryHelper"
          test -x "$APP/Contents/Helpers/VirtualDisplayHost"

      - name: Package DMG
        run: ./Tools/make-dmg.sh

      - name: Unit tests
        run: ./build.sh --test

      - name: Upload candidate DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fork-candidate-${{ github.sha }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14
