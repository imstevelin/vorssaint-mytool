name: Upstream assessment

on:
  schedule:
    # Monday / Thursday 01:00 UTC = 09:00 Asia/Taipei.
    - cron: '0 1 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-assessment
  cancel-in-progress: true

jobs:
  assess:
    if: github.repository == 'imstevelin/vorssaint-mytool'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch upstream and assess
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote add upstream https://github.com/vorssaint/vorssaint-utils.git
          python3 Tools/check-upstream.py --format json > upstream-report.json
          python3 - <<'PY'
          import importlib.util, json, pathlib
          spec = importlib.util.spec_from_file_location('assessment', 'Tools/check-upstream.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          pathlib.Path('upstream-report.md').write_text(module.markdown(json.loads(pathlib.Path('upstream-report.json').read_text())))
          PY
          cat upstream-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upstream-assessment
          path: upstream-report.*
          retention-days: 30
          if-no-files-found: error
